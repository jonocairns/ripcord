name: Release Server / Web

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Pipeline-created release tag to rebuild (historical tags such as v2.1.53 are unsupported)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: release-server
  cancel-in-progress: false

jobs:
  resolve:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      tag: ${{ steps.source.outputs.tag }}
      create: ${{ steps.source.outputs.create }}
      update: ${{ steps.source.outputs.update }}
      build: ${{ steps.source.outputs.build }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Resolve and verify release provenance
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_TAG: ${{ inputs.tag }}
        run: node scripts/release/cli.mjs resolve

  quality:
    needs: resolve
    uses: ./.github/workflows/pull-request.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  release-please:
    needs: [resolve, quality]
    if: needs.resolve.outputs.create == 'true' || needs.resolve.outputs.update == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Recheck main before PR maintenance
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/cli.mjs check-current

      # A bot token lets the release PR trigger the ordinary PR checks.
      - name: Mint release bot token
        id: app-token
        if: steps.context.outputs.current == 'true' && needs.resolve.outputs.update == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Mint release creation token
        id: release-token
        if: needs.resolve.outputs.create == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          # GitHub requires this when tagging a historical commit whose workflow
          # files differ from the current default branch. GITHUB_TOKEN cannot grant it.
          permission-workflows: write

      - name: Create tag and draft release
        id: release
        if: needs.resolve.outputs.create == 'true'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          target-branch: main
          token: ${{ steps.release-token.outputs.token }}
          skip-github-pull-request: true

      - name: Create or update release PR
        if: steps.context.outputs.current == 'true' && needs.resolve.outputs.update == 'true'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          target-branch: main
          token: ${{ steps.app-token.outputs.token }}
          skip-github-release: true

  build-and-publish:
    needs: [resolve, quality, release-please]
    if: >-
      always() && needs.quality.result == 'success' &&
      (needs.release-please.outputs.released == 'true' || needs.resolve.outputs.build == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      RELEASE_TAG: ${{ needs.release-please.outputs.tag || needs.resolve.outputs.tag }}
      EXPECTED_SHA: ${{ needs.resolve.outputs.sha }}
      GH_TOKEN: ${{ github.token }}
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      image: ${{ steps.ghcr.outputs.image }}
      digest: ${{ steps.docker.outputs.digest }}
      sha: ${{ needs.resolve.outputs.sha }}
    defaults:
      run:
        working-directory: source
    steps:
      # Execute verification code from the workflow commit, before running any
      # commands supplied by the release checkout. Builds use the immutable SHA.
      - name: Checkout automation
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          path: automation
      - name: Checkout verified release source
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
          path: source

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Verify release identity and package versions
        id: release
        run: node ../automation/scripts/release/cli.mjs verify

      - name: Install dependencies
        # Use the automation shell so recovery works for older release commits
        # that predate this shell. Dependencies and builds still run in source.
        run: nix develop ../automation#server-release -c bun install --frozen-lockfile

      - name: Build app
        working-directory: source/apps/server
        env:
          SHARKORD_VERSION: ${{ steps.release.outputs.version }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: nix develop ../../../automation#server-release -c bun run build

      - name: Resolve GHCR image
        id: ghcr
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Prepare Docker context
        run: |
          mkdir docker-release
          cp apps/server/build/out/sharkord-linux-x64 docker-release/
          cat > docker-release/Dockerfile <<'DOCKERFILE'
          FROM debian:bookworm-slim
          ENV RUNNING_IN_DOCKER=true
          ENV SHARKORD_TRUST_PROXY=true
          COPY --chmod=755 sharkord-linux-x64 /usr/local/bin/sharkord
          ENTRYPOINT ["/usr/local/bin/sharkord"]
          DOCKERFILE

      # The Linux binary must run without Nix. Boot it in the shipped image
      # before any image push or release upload.
      - name: Smoke test Linux server image
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          binary=docker-release/sharkord-linux-x64
          interpreter="$(readelf --program-headers "$binary" | sed -n 's/.*Requesting program interpreter: \(.*\)]/\1/p')"
          if [ "$interpreter" != /lib64/ld-linux-x86-64.so.2 ] || grep --quiet --binary-files=text /nix/store "$binary"; then
            echo "::error::$binary depends on Nix (interpreter: ${interpreter:-none})"
            exit 1
          fi

          docker build --tag sharkord-release-smoke docker-release
          container="$(docker run --detach --publish 127.0.0.1::4991 sharkord-release-smoke)"
          trap 'docker logs "$container"; docker rm --force "$container" >/dev/null' EXIT
          base_url="http://$(docker port "$container" 4991/tcp | head -n 1)"

          for _ in $(seq 60); do
            if curl --fail --silent --show-error "$base_url/healthz"; then
              break
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' "$container")" != true ]; then
              echo "::error::Server exited before becoming healthy"
              exit 1
            fi
            sleep 2
          done

          curl --fail --silent --show-error "$base_url/healthz"
          served_version="$(curl --fail --silent --show-error "$base_url/info" | jq --raw-output .version)"
          if [ "$served_version" != "$VERSION" ]; then
            echo "::error::Server reported version '$served_version', expected '$VERSION'"
            exit 1
          fi
          index_html="$(curl --fail --silent --show-error "$base_url/")"
          grep --quiet '<div id="root">' <<<"$index_html"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push versioned Docker image
        id: docker
        uses: docker/build-push-action@v7
        with:
          context: source/docker-release
          platforms: linux/amd64
          push: true
          tags: ${{ steps.ghcr.outputs.image }}:${{ steps.release.outputs.tag }}

      - name: Upload server assets to existing release
        run: |
          gh release upload "$RELEASE_TAG" \
            apps/server/build/out/sharkord-linux-x64 \
            apps/server/build/out/sharkord-windows-x64.exe \
            apps/server/build/out/sharkord-macos-arm64 \
            apps/server/build/out/release.json \
            --clobber

  release-desktop-windows:
    needs: build-and-publish
    if: always() && needs.build-and-publish.result == 'success'
    uses: ./.github/workflows/release-desktop-windows.yml
    permissions:
      contents: write
    with:
      tag: ${{ needs.build-and-publish.outputs.tag }}
      ref: ${{ needs.build-and-publish.outputs.sha }}
    secrets: inherit

  release-desktop-macos:
    needs: build-and-publish
    if: always() && needs.build-and-publish.result == 'success'
    uses: ./.github/workflows/release-desktop-macos.yml
    permissions:
      contents: write
    with:
      tag: ${{ needs.build-and-publish.outputs.tag }}
      ref: ${{ needs.build-and-publish.outputs.sha }}
    secrets: inherit

  release-desktop-linux:
    needs: build-and-publish
    if: always() && needs.build-and-publish.result == 'success'
    uses: ./.github/workflows/release-desktop-linux.yml
    permissions:
      contents: write
    with:
      tag: ${{ needs.build-and-publish.outputs.tag }}
      ref: ${{ needs.build-and-publish.outputs.sha }}
    secrets: inherit

  publish:
    needs: [build-and-publish, release-desktop-windows, release-desktop-macos, release-desktop-linux]
    if: >-
      always() && needs.build-and-publish.result == 'success' &&
      needs.release-desktop-windows.result == 'success' &&
      needs.release-desktop-macos.result == 'success' &&
      needs.release-desktop-linux.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.build-and-publish.outputs.tag }}
      IMAGE: ${{ needs.build-and-publish.outputs.image }}
      IMAGE_DIGEST: ${{ needs.build-and-publish.outputs.digest }}
      EXPECTED_SHA: ${{ needs.build-and-publish.outputs.sha }}
    steps:
      - name: Checkout publication automation
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish GitHub release, then promote Docker with bounded retries
        run: node scripts/release/cli.mjs publish
