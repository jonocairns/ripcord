name: Release Desktop (Windows)

on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag to upload to (e.g. v0.0.4 or beta)"
        required: true
        type: string
      ref:
        description: "Git ref to checkout (defaults to tag)"
        required: false
        type: string
        default: ""
      version:
        description: "package.json version to stamp (defaults to tag with leading v stripped)"
        required: false
        type: string
        default: ""
      prerelease:
        description: "Mark the GitHub release as a prerelease (also relaxes SemVer + signing checks)"
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (for manual reruns, e.g. v0.0.4)"
        required: true
        type: string
      ref:
        description: "Git ref to checkout (defaults to tag)"
        required: false
        type: string
        default: ""
      version:
        description: "package.json version to stamp (defaults to tag with leading v stripped)"
        required: false
        type: string
        default: ""
      prerelease:
        description: "Mark the GitHub release as a prerelease"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    # Dependency installs and build scripts run here, so this job gets a
    # read-only token.
    permissions:
      contents: read
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
      version: ${{ steps.resolve.outputs.version }}
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_REF: ${{ inputs.ref }}
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_PRERELEASE: ${{ inputs.prerelease }}

    steps:
      - name: Resolve inputs and validate
        id: resolve
        shell: bash
        env:
          HAS_CSC_SECRETS: ${{ secrets.WIN_CSC_LINK != '' && secrets.WIN_CSC_KEY_PASSWORD != '' }}
        run: |
          if [ -z "${RELEASE_TAG}" ]; then
            echo "::error::tag is required."
            exit 1
          fi

          ref="${RELEASE_REF:-${RELEASE_TAG}}"
          version="${RELEASE_VERSION:-${RELEASE_TAG#v}}"

          if [ "${RELEASE_PRERELEASE}" = "true" ]; then
            echo "Prerelease mode: relaxed tag/signing checks"
          else
            if ! echo "${RELEASE_TAG}" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::Invalid tag format: ${RELEASE_TAG} (expected vX.Y.Z)"
              exit 1
            fi
            if [ "${HAS_CSC_SECRETS}" != "true" ]; then
              echo "::error::Windows signing secrets are missing."
              echo "Set WIN_CSC_LINK and WIN_CSC_KEY_PASSWORD in repository secrets."
              exit 1
            fi
          fi

          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.resolve.outputs.ref }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: apps/desktop/sidecar -> target

      - name: Build client renderer
        working-directory: apps/client
        env:
          SHARKORD_VERSION: ${{ steps.resolve.outputs.version }}
        run: bun run build

      - name: Build desktop renderer and main process
        working-directory: apps/desktop
        run: |
          bun run build:sidecar
          bun run build:main
          bun run prepare:renderer

      - name: Set desktop package version for release build
        working-directory: apps/desktop
        shell: pwsh
        run: |
          $packageJsonPath = "package.json"
          $packageJson = Get-Content $packageJsonPath -Raw | ConvertFrom-Json
          $packageJson.version = "${{ steps.resolve.outputs.version }}"
          $packageJson | ConvertTo-Json -Depth 100 | Set-Content $packageJsonPath

      - name: Package Windows installer (signed if CSC secrets present)
        working-directory: apps/desktop
        shell: bash
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if [ -z "${CSC_LINK}" ] || [ -z "${CSC_KEY_PASSWORD}" ]; then
            echo "No CSC secrets present — building unsigned installer."
            unset CSC_LINK
            unset CSC_KEY_PASSWORD
          fi
          bunx electron-builder --win nsis --x64 --publish never

      - name: Validate updater metadata
        working-directory: apps/desktop
        shell: bash
        run: |
          set -euo pipefail

          # The app only verifies update signatures when app-update.yml names a
          # publisher; without it, updates would stay manual.
          app_update_config="build/out/win-unpacked/resources/app-update.yml"
          if ! grep -q '^publisherName:' "${app_update_config}"; then
            echo "::error::${app_update_config} has no publisherName."
            cat "${app_update_config}" || true
            exit 1
          fi

          if [ "${RELEASE_PRERELEASE}" = "true" ]; then
            echo "Prerelease build — skipping updater-metadata validation (beta.yml is not consumed by the stable channel)."
            exit 0
          fi

          metadata_file="$(ls build/out/latest*.yml 2>/dev/null | head -n1 || true)"
          if [ -z "${metadata_file}" ]; then
            echo "No latest*.yml updater metadata found in apps/desktop/build/out"
            ls -la build/out || true
            exit 1
          fi

          installer_path="$(sed -n 's/^path:[[:space:]]*//p' "${metadata_file}" | tr -d '\r' | head -n1)"
          installer_path="${installer_path#\"}"
          installer_path="${installer_path%\"}"

          if [ -z "${installer_path}" ]; then
            echo "Could not parse installer path from ${metadata_file}"
            sed -n '1,120p' "${metadata_file}" || true
            exit 1
          fi

          if [ ! -f "build/out/${installer_path}" ]; then
            echo "Updater metadata points to missing installer: build/out/${installer_path}"
            ls -la build/out || true
            sed -n '1,120p' "${metadata_file}" || true
            exit 1
          fi

          echo "Validated updater metadata installer path: ${installer_path}"

      - name: Keep desktop assets for signing and upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-windows
          path: |
            apps/desktop/build/out/*.exe
            apps/desktop/build/out/*.blockmap
            apps/desktop/build/out/latest*.yml
          if-no-files-found: error
          retention-days: 1

  # Signing runs apart from the build so no dependency install or build script
  # shares a runner with the update signing key. The key is a `release`
  # environment secret, so only workflows running on main can read it. The
  # scripts run from this workflow's own main commit, not from the `ref` input,
  # so a dispatch naming another branch cannot run that branch's code with the
  # key; only the changelog and public keys come from the release ref.
  sign:
    needs: build
    if: inputs.prerelease != true
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read

    steps:
      - name: Checkout release scripts
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Checkout the release's changelog and update keys
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.build.outputs.ref }}
          path: release-src
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            CHANGELOG.md
            apps/desktop/src/main/update-signing-keys.json

      - name: Download desktop assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: desktop-windows
          path: desktop-out

      - name: Sign the update and add release notes
        env:
          DESKTOP_UPDATE_DIR: desktop-out
          DESKTOP_UPDATE_SOURCE_DIR: release-src
          DESKTOP_UPDATE_VERSION: ${{ needs.build.outputs.version }}
          DESKTOP_UPDATE_SIGNING_KEY: ${{ secrets.DESKTOP_UPDATE_SIGNING_KEY }}
        run: node scripts/release/cli.mjs finalize-desktop-update

      - name: Keep signed updater metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-windows-signed-metadata
          path: desktop-out/latest.yml
          if-no-files-found: error
          retention-days: 1

  upload:
    needs: [build, sign]
    if: >-
      always() && needs.build.result == 'success' &&
      (needs.sign.result == 'success' || (inputs.prerelease == true && needs.sign.result == 'skipped'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_PRERELEASE: ${{ inputs.prerelease }}

    steps:
      - name: Download desktop assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: desktop-windows
          path: desktop-out

      - name: Download signed updater metadata
        if: inputs.prerelease != true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: desktop-windows-signed-metadata
          path: desktop-signed

      - name: Use signed updater metadata
        if: inputs.prerelease != true
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^ripcordUpdateSignature:' desktop-signed/latest.yml
          cp desktop-signed/latest.yml desktop-out/latest.yml

      - name: Upload desktop assets to GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          assets=(
            desktop-out/*.exe
            desktop-out/*.blockmap
            desktop-out/latest*.yml
          )

          if [ ${#assets[@]} -eq 0 ]; then
            echo "::error::No desktop release assets found to upload."
            exit 1
          fi

          if [ "${RELEASE_PRERELEASE}" != "true" ]; then
            gh release view "${RELEASE_TAG}" >/dev/null
          elif ! gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release create "${RELEASE_TAG}" \
              --title "${RELEASE_TAG}" \
              --notes "" \
              --prerelease
          elif [ "${RELEASE_PRERELEASE}" = "true" ]; then
            gh release edit "${RELEASE_TAG}" --prerelease
          fi

          gh release upload "${RELEASE_TAG}" "${assets[@]}" --clobber
