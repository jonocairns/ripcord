name: Ripcord
options:
  bundleIdPrefix: nz.ripcord.poc
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: NO
    MARKETING_VERSION: "0.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
packages:
  Mediasoup:
    url: https://github.com/VLprojects/mediasoup-client-swift.git
    exactVersion: 0.13.2
targets:
  Ripcord:
    type: application
    platform: iOS
    sources: [Ripcord]
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: Mediasoup
        product: Mediasoup
    info:
      path: Ripcord/Info.plist
      properties:
        CFBundleDisplayName: Ripcord
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: Talk with people in Ripcord voice channels.
        NSLocalNetworkUsageDescription: Connect to your local Ripcord development server.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  RipcordTests:
    type: bundle.unit-test
    platform: iOS
    sources: [RipcordTests]
    dependencies:
      - target: Ripcord
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  RipcordUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [RipcordUITests]
    dependencies:
      - target: Ripcord
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Ripcord:
    build:
      targets:
        Ripcord: all
    test:
      targets: [RipcordTests, RipcordUITests]
      gatherCoverageData: false
